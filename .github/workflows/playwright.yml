name: Playwright Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - e2e
          - api
          - all

permissions:
  contents: read
  checks: write

env:
  BASE_URL: https://vb-bank-demo.vercel.app
  CI: true

jobs:
  # Smoke tests run on every push/PR
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.test_type == 'smoke' || github.event.inputs.test_type == 'all'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Restore test history
        uses: actions/cache/restore@v4
        with:
          path: test-history.json
          key: test-history-smoke-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            test-history-smoke-${{ github.ref_name }}-
            test-history-smoke-

      - name: Run smoke tests
        run: npm run test:ci:smoke
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Save test history
        uses: actions/cache/save@v4
        if: always()
        with:
          path: test-history.json
          key: test-history-smoke-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-html-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: test-results/
          retention-days: 7

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Smoke Test Results
          path: test-results/**/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/junit-report.xml ]; then
            TESTS=$(grep -oP 'tests="\K[0-9]+' test-results/junit-report.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results/junit-report.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[0-9]+' test-results/junit-report.xml | head -1)
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' test-results/junit-report.xml | head -1)
            TIME=$(grep -oP 'time="\K[0-9.]+' test-results/junit-report.xml | head -1)
            PASSED=$((TESTS - FAILURES - ERRORS - SKIPPED))
            if [ "$FAILURES" -eq 0 ] && [ "$ERRORS" -eq 0 ]; then
              echo "### ✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILURES |" >> $GITHUB_STEP_SUMMARY
            echo "| 💥 Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 📊 Total | $TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${TIME}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # List failed tests
            FAILED_TESTS=$(grep -oP '<testcase[^>]*name="\K[^"]+' test-results/junit-report.xml | head -20)
            FAILED_NAMES=$(grep -B1 '<failure' test-results/junit-report.xml | grep -oP 'name="\K[^"]+' | head -20)
            if [ -n "$FAILED_NAMES" ]; then
              echo "<details><summary>Failed Tests</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$FAILED_NAMES" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ No JUnit report found at test-results/junit-report.xml" >> $GITHUB_STEP_SUMMARY
          fi

